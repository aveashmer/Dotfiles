# ==========================
# 1. БАЗОВЫЕ НАСТРОЙКИ СИСТЕМЫ
# ==========================
# zsh по умолчанию внутри tmux
set -g default-shell /bin/zsh

# Включаем правильную поддержку 256 цветов и True-Color
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"
set -ag terminal-overrides ",*256col*:Tc"

# Общие удобства
set -g set-clipboard on         # Включаем системный буфер обмена
set -g escape-time 0            # Убираем задержку при нажатии ESC (очень важно для Neovim)
set -g history-limit 1000000    # Увеличиваем историю прокрутки терминала до 1 млн строк
set -g mouse on                 # Включаем мышь (клики, ресайз, скролл)
set -g status-interval 3        # Обновляем статус-бар каждые 3 секунды (вместо 15 по умолчанию)
set -g allow-passthrough on     # Разрешаем пропуск изображений в терминал (например, для yazi)
set -ga update-environment "TERM_PROGRAM"

# ==========================
# 2. ГОРЯЧИЕ КЛАВИШИ (БИНДЫ)
# ==========================
# Устанавливаем префикс на Ctrl + a)
unbind C-b
set -g prefix C-a

# Быстрая перезагрузка конфига по нажатию Prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Удобное разделение окон
unbind %
bind \\ split-window -h -c "#{pane_current_path}" # Prefix + \ для вертикального сплита
unbind \"
bind - split-window -v -c "#{pane_current_path}"  # Prefix + - для горизонтального сплита

# Новое окно (вкладка) тоже открывается в текущей папке
bind c new-window -c "#{pane_current_path}"

# Изменение размера панелей в стиле Vim (Prefix + H/J/K/L)
bind -r j resize-pane -D 5 # Вниз
bind -r k resize-pane -U 5 # Вверх
bind -r l resize-pane -R 5 # Вправо
bind -r h resize-pane -L 5 # Влево

# Максимизировать текущую панель на весь экран (Prefix + m)
bind -r m resize-pane -Z

# ==========================
# 3. РЕЖИМ КОПИРОВАНИЯ (VIM MODE)
# ==========================
# Включаем навигацию клавишами Vim в режиме копирования (Prefix + [)
set-window-option -g mode-keys vi

# Выделение текста на 'v' (как в Neovim)
bind-key -T copy-mode-vi 'v' send -X begin-selection 

# Копирование выделенного на 'y'
bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "pbcopy"

# Вставка текста на Prefix + P (заглавная)
bind P paste-buffer
 
# Не выходить из режима копирования при отпускании мышки
unbind -T copy-mode-vi MouseDragEnd1Pane

# ==========================
# 4. НАВИГАЦИЯ ОКОН И ПАНЕЛЕЙ
# ==========================
# Начинаем нумерацию с 1 (чтобы не тянуться к 0 на клавиатуре)
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on # Автоматически перенумеровывать окна при закрытии одного из них

# ==========================
# 5. ПЛАГИНЫ (TPM)
# ==========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Сохранение сессий при перезагрузке (Prefix + Ctrl-s)
set -g @plugin 'tmux-plugins/tmux-continuum'    # Авто-сохранение сессий каждые 15 минут
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor' # Плагин для показа CPU и RAM в статус-баре

# Настройки плагинов сессий
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# ==========================
# 6. ВНЕШНИЙ ВИД (ТЕМА VAGUE)
# ==========================
# Цветовая палитра
v_bg="#141415"         # Фон
v_bg_alt="#1c1c24"     # Неактивный фон
v_fg="#cdcdcd"         # Текст
v_gray="#606079"       # Комментарии (приглушенный)
v_accent="#c48282"     # Акцент 1 (розовато-красный)
v_accent2="#aeaed1"    # Акцент 2 (пурпурный)
v_alt="#b4d4cf"        # Акцент 3 (бирюзовый)
v_visual="#333738"     # Цвет выделения
v_line="#252530"       # Цвет линий/границ

# Статус-бар (переносим наверх, чтобы не сливался с командной строкой Neovim)
set -g status-position top
set -g status-left-length 100
set -g status-style "fg=${v_fg},bg=${v_bg}"

# Левая часть статуса: Иконка и имя сессии (проекта)
set -g status-left "#[fg=${v_accent},bold]  #S #[fg=${v_gray},nobold] | "

# Правая часть статуса: Графики CPU и RAM
set -g status-right "#[fg=${v_accent2}] #{cpu}  #[fg=${v_alt}] #{mem} "

# Вкладки по центру
set -g window-status-current-format "#[fg=${v_fg},bold] #I.#W " # Текущая вкладка яркая
set -g window-status-format " #[fg=${v_gray}]#I.#W "            # Остальные вкладки серые

# Цвета сообщений и режима выделения
set -g message-style "fg=${v_fg},bg=${v_bg}"
set -g mode-style "fg=${v_fg},bg=${v_visual}"

# Границы панелей (Сплитов)
set -g pane-border-style "fg=${v_line}"              # Цвет границы неактивного окна
set -g pane-active-border-style "fg=${v_accent}"     # Цвет границы активного окна

# Инициализация менеджера плагинов (ДОЛЖНА БЫТЬ В САМОМ НИЗУ)
run '~/.tmux/plugins/tpm/tpm'
